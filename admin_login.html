
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | CivicSense AI</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid;
            place-items: center; padding: 20px;
            font-family: Arial, sans-serif;
            background: #edf3fa; color: #18304e;
        }
        .card {
            width: 100%; max-width: 420px; padding: 30px;
            background: white; border-radius: 16px;
            box-shadow: 0 10px 35px #142b4715;
        }
        h1 { margin-top: 0; }
        p { color: #687991; line-height: 1.5; }
        label { display: block; margin: 16px 0 7px; font-weight: bold; }
        input {
            width: 100%; padding: 12px; border: 1px solid #ccd7e5;
            border-radius: 7px; font-size: 16px;
        }
        button {
            width: 100%; padding: 13px; margin-top: 22px;
            border: 0; border-radius: 7px; background: #1768ad;
            color: white; font-weight: bold; cursor: pointer;
        }
        .error { color: #a32121; background: #ffeded; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>🏙 CivicSense AI</h1>
        <p>Authorized administrator sign-in</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('main.admin_login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <label for="username">Admin username</label>
            <input id="username" name="username"
                   autocomplete="username" required maxlength="100">

            <label for="password">Password</label>
            <input id="password" type="password" name="password"
                   autocomplete="current-password" required>

            <button type="submit">Sign In</button>
        </form>
    </main>
</body>
</html>
